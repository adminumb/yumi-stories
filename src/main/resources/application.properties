spring.application.name=yumi-stories
server.port=8080

# Файловая БД: данные сохраняются в файл ./data/yumi-stories.mv.db
# и не теряются при перезапуске приложения (в отличие от in-memory H2).
spring.datasource.url=jdbc:h2:file:./data/yumi-stories
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate сам создаёт/обновляет таблицы по нашим @Entity
# классам. Удобно для разработки; для "боевого" проекта потом заменим
# на настоящие миграции (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Веб-консоль для просмотра содержимого БД в браузере.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
